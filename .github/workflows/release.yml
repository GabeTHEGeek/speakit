name: Release macOS DMG

# Push a version tag (for example `v0.2.49`) to build, sign, notarize and publish
# the DMG to a GitHub Release. Run it by hand from the Actions tab to test the
# signing setup: a manual run uploads the DMG as a workflow artifact and does
# not create a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon runner, matches the aarch64 packaged build
    timeout-minutes: 90
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${VERSION} (expected v${VERSION})."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Import Developer ID certificate
        id: keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE secret is not set."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in APPLE_CERTIFICATE."
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "path=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      # Tauri signs the app with hardened runtime and Entitlements.plist, then
      # notarizes and staples the .app using APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID.
      # APPLE_SIGNING_IDENTITY overrides the local signingIdentity hash in tauri.conf.json.
      - name: Build, sign and notarize app
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.keychain.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target "$TARGET" --bundles dmg

      - name: Sign, notarize and staple DMG
        id: dmg
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg | head -n 1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG produced."
            exit 1
          fi
          echo "DMG: $DMG"

          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"

          # Fail the release if Gatekeeper would not accept the result.
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" \
              --title "SpeakIt ${{ steps.version.outputs.version }}" \
              --generate-notes --verify-tag
          fi

      - name: Remove signing keychain
        if: always() && steps.keychain.outputs.path != ''
        run: security delete-keychain "${{ steps.keychain.outputs.path }}" || true
